# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_col?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as CSX_BATCH_)
    database-change-log-table: csx_databasechangelog
    database-change-log-lock-table: csx_databasechangeloglock

dcre:
  # SCRUM-88 (M12): persistent JDBC JobRepository prefix, re-homed off the dead
  # spring.batch.jdbc.table-prefix (Boot 4.1 no longer binds it) onto live config
  # BatchJdbcConfig reads via BatchProperties.
  batch:
    table-prefix: CSX_BATCH_
  # SCRUM-88 (M12): second read-write datasource for the HeartbeatWriter liveness
  # stamp on agt_ops.launch_intent (HeartbeatDatasourceConfig).
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  csx:
    # SCRUM-42: reply upserts commit in bounded slices; one giant serializable
    # tx is unrefreshable at 300k rows (RETRY_SERIALIZABLE).
    ingest-slice-size: ${DCRE_CSX_INGEST_SLICE_SIZE:10000}
