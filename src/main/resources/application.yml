# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_collections?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  batch:
    jdbc:
      table-prefix: SXR_BATCH_
      initialize-schema: never
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as SXR_BATCH_)
    database-change-log-table: sxr_databasechangelog
    database-change-log-lock-table: sxr_databasechangeloglock

dcre:
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../infra/dcre-infra/exchange}
